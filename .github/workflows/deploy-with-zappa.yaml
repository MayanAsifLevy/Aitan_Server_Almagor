name: Deploy to AWS with Zappa

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      #   - name: Update Zappa settings
      #     run: |
      #       zappa update dev  # Replace 'dev' with your Zappa environment

      - name: Deploy with Zappa
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DB_KEY: ${{ secrets.DB_KEY }}
          DB_URI: ${{ secrets.DB_URI }}
          DB_ALGORITHM: ${{ vars.DB_ALGORITHM }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ vars.DB_DATABASE }}
          DB_DATABASEUSERS: ${{ vars.DB_DATABASEUSERS }}
        run: |
          zappa update --no_venv
